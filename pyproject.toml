[project]
name = "pymadx"
requires-python = ">=3.8"
dynamic = ["version"]
readme = "README.md"
description = "Package for loading MADX output."
license = {file = "LICENCE.txt"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development"
    ]
authors = [
  {name = "JAI@RHUL", email = "laurie.nevay@cern.ch"}
]
maintainers = [
  {name = "Laurie Nevay", email = "laurie.nevay@cern.ch"}
]
dependencies = [
  "matplotlib>=3.0",
  "numpy>=1.14",
  "importlib-metadata",
  "tabulate"
]

[project.optional-dependencies]
pytransport = ["pytransport"]
dev = ["pytest", "sphinx", "sphinx-rtd-theme", "cpymad"]

[project.scripts]
pymadx_rmatrix_print = "pymadx.Cli:main_PrintRMatrix"
pymadx_rmatrix_pdf = "pymadx.Cli:main_PrintRMatrixPdf"
pymadx_rmatrix_plot = "pymadx.Cli:main_PlotRMatrix"
pymadx_twiss_plot = "pymadx.Cli:main_PlotTwiss"

[project.urls]
homepage = "https://bdsim-collaboration.github.io/web/"
documentation = "https://bdsim-collaboration.github.io/pymadx"
repository = "https://github.com/bdsim-collaboration/pymadx"

[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/pymadx/_version.py"